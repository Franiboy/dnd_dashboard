# D&D Dashboard nginx reverse proxy (reference for server migrations).
#
# This mirrors the live config at /etc/nginx/sites-available/dnd-dashboard.
# The SSL block is managed by Certbot and regenerated by:
#   sudo certbot --nginx -d einsnicergameserver.de
# (The live file therefore also contains the `# managed by Certbot` lines.)
#
# Install (see scripts/dnd-server-setup.sh):
#   sudo cp deploy/nginx-dnd-dashboard.conf /etc/nginx/sites-available/dnd-dashboard
#   sudo ln -sf /etc/nginx/sites-available/dnd-dashboard /etc/nginx/sites-enabled/dnd-dashboard
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name einsnicergameserver.de;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/einsnicergameserver.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/einsnicergameserver.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = einsnicergameserver.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name einsnicergameserver.de;
    return 404; # managed by Certbot
}
