name: CodeQL

on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 3 * * 1'

# The analysis needs to write its own results, nothing else.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    # Code scanning is free for a public repository but part of GitHub Advanced
    # Security for a private one, where the action answers
    # "CodeQL job status was configuration error". The gate exists for that
    # reason alone and is enabled while the repository is public. This workflow
    # triggers on a push to main and on a weekly schedule, not per pull
    # request, so a pull request is analysed by the push that eventually
    # reaches main.
    if: vars.DND_CODEQL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      # Only push and schedule trigger this workflow, so the revision is the
      # commit itself. There is no pull-request event to read a head from.
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
