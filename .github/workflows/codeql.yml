name: CodeQL

on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 3 * * 1'

# The analysis needs to write its own results, nothing else.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    # Code scanning is free for a public repository but part of GitHub Advanced
    # Security for a private one, where the action answers
    # "CodeQL job status was configuration error". The gate therefore stays
    # closed until publication, and the publication runbook in docs/ci-cd.md sets
    # the variable in the same step that changes the visibility.
    if: vars.DND_CODEQL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      # Only push and schedule trigger this workflow, so the revision is the
      # commit itself. There is no pull-request event to read a head from.
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
