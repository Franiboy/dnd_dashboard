name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit on main to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dnd-public-release
  cancel-in-progress: false

jobs:
  build:
    name: Build release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release_sha: ${{ steps.validate.outputs.sha }}
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
    steps:
      # The token is never persisted in .git/config. The build container mounts
      # this workspace and executes repository code, so a credential left in the
      # checkout would be readable by that code.
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release revision
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Fetched with an explicit one-shot header instead of a persisted
          # credential; the header is passed per command and never written to
          # .git/config, which the build container can read.
          # shellcheck disable=SC2016
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth_header" fetch --quiet origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git checkout --quiet --detach "$RELEASE_SHA"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      # Native addons are resolved against the libc of the machine that runs
      # `npm ci`. Production is Ubuntu 24.04 (glibc 2.39), so the dependency
      # install must happen on this runner and not inside the disposable
      # container, whose Debian bookworm base carries glibc 2.36. A mismatch
      # publishes a release that cannot load its native modules on production.
      - name: Install dependencies for the production target
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Build and validate in disposable container
        shell: bash
        env:
          RELEASE_IMAGE: node@sha256:107ceb6ad85808049dccef12414bf17b08eceb299eaf755c0339dc5fc8958d6b
        run: |
          set -euo pipefail
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=512 \
            --memory=4g \
            --cpus=2 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=2g \
            --tmpfs /run:rw,nosuid,nodev,size=64m \
            -e HOME=/tmp/home \
            -e CI=true \
            -e npm_config_cache=/tmp/npm-cache \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RELEASE_IMAGE" \
            bash -c 'set -euo pipefail; mkdir -p /tmp/home /tmp/npm-cache; npm run format:check; npm run lint; npm test; npm run build; node --check dist-server/server/index.js; node --check dist-server/scripts/db-migrate.js'

      - name: Verify source tree after container build
        shell: bash
        run: |
          set -euo pipefail
          git diff --no-ext-diff --no-textconv --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Package release
        shell: bash
        env:
          DND_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: bash scripts/package-release.sh "$RUNNER_TEMP/dnd-release.tar.gz"

      - name: Verify release archive
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP" && sha256sum -c dnd-release.tar.gz.sha256)
          tar -tzf "$RUNNER_TEMP/dnd-release.tar.gz" >/dev/null

      # Guards against publishing a release whose native addons cannot load on
      # the production target. A glibc mismatch between the build host and
      # production produced an undeployable release once already.
      - name: Verify release native modules for the production target
        shell: bash
        env:
          PRODUCTION_GLIBC: '2.39'
        run: bash scripts/verify-release-native.sh "$RUNNER_TEMP/dnd-release.tar.gz" "$PRODUCTION_GLIBC"

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dnd-release-${{ steps.validate.outputs.sha }}
          path: |
            ${{ runner.temp }}/dnd-release.tar.gz
            ${{ runner.temp }}/dnd-release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish release asset
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dnd-release-${{ needs.build.outputs.release_sha }}
          path: ${{ runner.temp }}/release

      - name: Publish immutable release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/release" && sha256sum -c dnd-release.tar.gz.sha256)
          tar -tzf "$RUNNER_TEMP/release/dnd-release.tar.gz" >/dev/null
          tag="release-${RELEASE_SHA}"
          if gh release view "$tag" --repo "$SOURCE_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace immutable assets" >&2
            exit 1
          fi
          gh release create "$tag" \
            --repo "$SOURCE_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Release ${RELEASE_SHA:0:12}" \
            --notes "Automated immutable build for ${RELEASE_SHA}."
          gh release upload "$tag" \
            --repo "$SOURCE_REPOSITORY" \
            "$RUNNER_TEMP/release/dnd-release.tar.gz" \
            "$RUNNER_TEMP/release/dnd-release.tar.gz.sha256"
          published_target="$(gh release view "$tag" --repo "$SOURCE_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
          [ "$published_target" = "$RELEASE_SHA" ] || {
            echo "Release target mismatch: $published_target" >&2
            exit 1
          }
          published_commit="$(gh api "repos/${SOURCE_REPOSITORY}/commits/${tag}" --jq '.sha')"
          [ "$published_commit" = "$RELEASE_SHA" ] || {
            echo "Release tag resolves to an unexpected commit: $published_commit" >&2
            exit 1
          }
          printf 'Published immutable release asset: %s\n' "$tag"

      - name: Dispatch private production deployment
        if: ${{ vars.DND_AUTO_DEPLOY_ENABLED == 'true' }}
        shell: bash
        env:
          DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          DEPLOY_REPOSITORY: Franiboy/dnd_dashboard-deploy
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_DISPATCH_TOKEN" ]; then
            echo 'DEPLOY_DISPATCH_TOKEN is required when DND_AUTO_DEPLOY_ENABLED=true' >&2
            exit 1
          fi
          GH_TOKEN="$DEPLOY_DISPATCH_TOKEN" gh workflow run deploy.yml \
            --repo "$DEPLOY_REPOSITORY" \
            --ref main \
            -f "sha=$RELEASE_SHA"
          printf 'Dispatched production deployment for %s\n' "$RELEASE_SHA"
