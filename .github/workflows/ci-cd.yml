name: CI

on:
  push:
    branches:
      - main
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Keep pull-request and trusted-target runs alive while an AI fix commit
  # starts its fresh CI run. Only main-push runs may cancel older runs.
  cancel-in-progress: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}

jobs:
  ci:
    name: CI
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'Franiboy')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # The split-repository boundary only holds while no job here runs on the
      # production host, so the invariant is checked and not only documented.
      - name: Verify no self-hosted job
        run: bash scripts/verify-source-runners.sh .

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The trusted source workflow only dispatches the private review workflow.
  # The private dispatcher is the caller of the self-hosted reusable workflow,
  # so its repository-scoped JIT runner is eligible. No self-hosted job or
  # write-capable AI credential is defined in this repository.
  trusted-ai-review:
    name: Dispatch trusted AI review
    needs: ci
    if: >-
      github.event_name == 'pull_request_target' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'Franiboy' &&
      vars.DND_AI_REVIEW_ENABLED == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'automerge') &&
      !contains(github.event.pull_request.labels.*.name, 'hold')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.AI_DISPATCH_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      SOURCE_RUN_ID: ${{ github.run_id }}
      SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
      PRIVATE_AUTOMATION_REF: ${{ vars.DND_PRIVATE_AUTOMATION_REF }}
    steps:
      # github.event.pull_request.base.sha is the base commit recorded when the
      # pull request was created or last synchronized. For a pull request that
      # stays open across a merge it keeps pointing at an older main, and the
      # review then refuses that stale base. The review must always run against
      # the current main tip, and its own guard rejects the review if main moves
      # again between this dispatch and the review job.
      - name: Resolve the current base commit
        id: base
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$BASE_BRANCH" == 'main' ]]
          base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BASE_BRANCH}" --jq '.sha')"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"

      # DND_PRIVATE_AUTOMATION_REF is maintained by hand and goes stale with
      # every commit in the private repository. The private dispatcher rejects
      # a run whose own commit differs from the requested ref, which used to
      # fail silently here because `gh workflow run` returns 0 once the
      # request is accepted. Both checks below make the failure visible in this
      # run, where it can still be acted on.
      - name: Verify private automation pin
        id: pin
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AI_DISPATCH_TOKEN }}
        run: |
          set -Eeuo pipefail
          private_main="$(gh api repos/Franiboy/dnd_dashboard-deploy/commits/main --jq '.sha' 2>/dev/null || true)"
          if [ -z "$private_main" ]; then
            printf '::warning::cannot read the private main tip with this token; skipping the pin pre-check\n'
            printf 'stale=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$private_main" != "$PRIVATE_AUTOMATION_REF" ]; then
            printf '::error::DND_PRIVATE_AUTOMATION_REF is %s but the private main tip is %s; update the source variable to the private main tip\n' \
              "$PRIVATE_AUTOMATION_REF" "$private_main"
            exit 1
          fi
          printf 'stale=false\n' >> "$GITHUB_OUTPUT"

      - name: Dispatch private ephemeral AI review
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$PRIVATE_AUTOMATION_REF" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run ai-review-dispatch.yml \
            --repo Franiboy/dnd_dashboard-deploy \
            --ref main \
            -f source_run_id="$SOURCE_RUN_ID" \
            -f source_run_attempt="$SOURCE_RUN_ATTEMPT" \
            -f dispatch_ref="$PRIVATE_AUTOMATION_REF" \
            -f pr_number="$PR_NUMBER" \
            -f head_sha="$HEAD_SHA" \
            -f base_sha="$BASE_SHA"

      # Confirms the private repository really started a run. Without this the
      # dispatch looks successful in this repository even when the private
      # validation job rejects the request.
      - name: Verify the private review run started
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AI_DISPATCH_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          for _ in 1 2 3 4 5 6; do
            run_id="$(gh run list --repo Franiboy/dnd_dashboard-deploy \
              --workflow ai-review-dispatch.yml --limit 5 \
              --json headSha --jq "[.[] | select(.headSha == \"$HEAD_SHA\")] | first | .databaseId" 2>/dev/null || true)"
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              printf 'private review run: %s\n' "$run_id"
              exit 0
            fi
            sleep 10
          done
          printf '::error::the private dispatcher accepted no run for %s; check DND_PRIVATE_AI_ENABLED and DND_PRIVATE_AUTOMATION_REF in the private repository\n' "$HEAD_SHA"
          exit 1
