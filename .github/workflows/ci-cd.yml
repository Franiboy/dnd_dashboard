name: CI

on:
  push:
    branches:
      - main
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  # The event is part of the group on purpose. Both run types used to share one
  # group, which serialised them: the trusted run held the group while the
  # pull_request run waited, and the trusted gate then waited for the
  # pull_request run it had just blocked. Separate groups let both run, and the
  # existing "never cancel a pull request run" rule is unaffected.
  group: ci-${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Keep pull-request and trusted-target runs alive while an AI fix commit
  # starts its fresh CI run. Only main-push runs may cancel older runs.
  cancel-in-progress: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}

jobs:
  ci:
    # One workflow, two jobs that never share a name. The pull_request run tests
    # the head commit. The trusted-target run does not repeat that work: it only
    # proves the pull_request CI for the same commit was green, so the dispatch
    # has an unambiguous green predecessor and the promotion gate selects a
    # single check.
    name: ${{ github.event_name == 'pull_request_target' && 'CI (trusted gate)' || 'CI' }}
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'Franiboy')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Only the pull_request run checks out the pull request head. In the
      # pull_request_target run the head is never materialised, because that run
      # carries the base repository's token: a checkout plus any repository
      # script would be pull request code executing in the trusted context. The
      # trusted run reads what it needs through the API as text instead.
      - name: Checkout exact revision
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # The split-repository boundary only holds while no job here runs on the
      # production host, so the invariant is checked and not only documented.
      # The pull request may still propose such a workflow, and the two run
      # types check it without ever executing the same kind of code.
      #
      # In the pull_request run the checkout already exists and the suite
      # installs dependencies and runs the pull request's own tests, so running
      # the checked-out script adds no new capability to that context.
      - name: Verify no self-hosted job
        if: github.event_name != 'pull_request_target'
        run: bash scripts/verify-source-runners.sh .

      # The same invariant in the trusted run, without a checkout and without
      # executing anything from the repository. gh writes an API error body to
      # stdout, so every read is checked by exit status and fails closed: an
      # unreadable listing is treated as a violation, never as "nothing to
      # check". The job condition already restricts this run to a head inside
      # this repository, which is what makes the base token able to read it.
      - name: Verify the pull request adds no self-hosted job
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          api="repos/${GITHUB_REPOSITORY}/contents"
          if ! listing="$(gh api "${api}/.github/workflows?ref=${HEAD_SHA}" --jq '.[].path')"; then
            printf '::error::could not read the workflow directory of %s; the runner invariant is unproven\n' \
              "${HEAD_SHA:0:12}" >&2
            exit 1
          fi
          checked=0
          violations=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              *.yml | *.yaml) ;;
              *) continue ;;
            esac
            if ! content="$(gh api "${api}/${path}?ref=${HEAD_SHA}" --jq '.content' | tr -d '\n' | base64 -d)"; then
              printf '::error::could not read %s at %s; the runner invariant is unproven\n' \
                "$path" "${HEAD_SHA:0:12}" >&2
              exit 1
            fi
            checked=$((checked + 1))
            # Only `runs-on` lines are inspected, so prose in comments cannot
            # trip the check and a mentioned label cannot hide a real one.
            while IFS= read -r line; do
              printf '  %s: %s\n' "$path" "$(printf '%s' "$line" | sed 's/^[[:space:]]*//')" >&2
              violations=$((violations + 1))
            done < <(printf '%s\n' "$content" | grep -nE '^[[:space:]]*(-[[:space:]]+)?runs-on:.*self-hosted' || true)
          done <<< "$listing"
          if [ "$checked" -eq 0 ]; then
            printf '::error::no workflow file was read from %s; the runner invariant is unproven\n' \
              "${HEAD_SHA:0:12}" >&2
            exit 1
          fi
          if [ "$violations" -ne 0 ]; then
            printf '::error::this repository must never schedule a job on a self-hosted runner (%d violation(s) at %s)\n' \
              "$violations" "${HEAD_SHA:0:12}" >&2
            exit 1
          fi
          printf 'checked %d workflow file(s) at %s, no self-hosted job\n' "$checked" "${HEAD_SHA:0:12}"

      - name: Setup Node
        if: github.event_name != 'pull_request_target'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: github.event_name != 'pull_request_target'
        run: npm ci

      - name: Check formatting
        if: github.event_name != 'pull_request_target'
        run: npm run format:check

      - name: Lint
        if: github.event_name != 'pull_request_target'
        run: npm run lint

      - name: Test
        if: github.event_name != 'pull_request_target'
        run: npm test

      - name: Build
        if: github.event_name != 'pull_request_target'
        run: npm run build

      # The trusted gate reads the pull_request run instead of repeating it. Three
      # consequences beyond the saved time: no dependency lifecycle script from a
      # pull request ever executes under a pull_request_target token, no
      # repository file is even checked out in that run, and the promotion gate
      # in the private repository no longer has to guess between two identically
      # named checks.
      - name: Require green pull request CI for this head
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" --jq \
              '[.workflow_runs[] | select(.name == "CI")] | sort_by(.id) | last | if . == null then "missing" elif .status != "completed" then "pending" elif .conclusion == "success" then "success" else "failed" end')"
            case "$state" in
              success)
                printf 'pull request CI is green on %s\n' "${HEAD_SHA:0:12}"
                exit 0
                ;;
              failed)
                printf '::error::the pull request CI for %s did not succeed; the AI review is not dispatched\n' \
                  "${HEAD_SHA:0:12}"
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              printf '::error::no completed pull request CI run for %s within 900s\n' "${HEAD_SHA:0:12}"
              exit 1
            fi
            sleep 15
          done

  # The trusted source workflow only dispatches the private review workflow.
  # The private dispatcher is the caller of the self-hosted reusable workflow,
  # so its repository-scoped JIT runner is eligible. No self-hosted job or
  # write-capable AI credential is defined in this repository.
  trusted-ai-review:
    name: Dispatch trusted AI review
    needs: ci
    if: >-
      github.event_name == 'pull_request_target' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'Franiboy' &&
      vars.DND_AI_REVIEW_ENABLED == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'automerge') &&
      !contains(github.event.pull_request.labels.*.name, 'hold')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.AI_DISPATCH_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      SOURCE_RUN_ID: ${{ github.run_id }}
      SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
      PRIVATE_AUTOMATION_REF: ${{ vars.DND_PRIVATE_AUTOMATION_REF }}
    steps:
      # github.event.pull_request.base.sha is the base commit recorded when the
      # pull request was created or last synchronized. For a pull request that
      # stays open across a merge it keeps pointing at an older main, and the
      # review then refuses that stale base. The review must always run against
      # the current main tip, and its own guard rejects the review if main moves
      # again between this dispatch and the review job.
      - name: Resolve the current base commit
        id: base
        shell: bash
        env:
          # Deliberately the job's own token, not AI_DISPATCH_TOKEN. That token
          # only has visibility into the private repository, so a read of the
          # public source repository answers 404 and aborts the dispatch. The
          # job already declares contents: read, which is all this needs.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$BASE_BRANCH" == 'main' ]]
          base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BASE_BRANCH}" --jq '.sha')"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"

      # DND_PRIVATE_AUTOMATION_REF is maintained by hand and goes stale with
      # every commit in the private repository. The private dispatcher rejects
      # a run whose own commit differs from the requested ref, which used to
      # fail silently here because `gh workflow run` returns 0 once the
      # request is accepted. Both checks below make the failure visible in this
      # run, where it can still be acted on.
      #
      # The pre-check needs contents access to the private repository, which
      # AI_DISPATCH_TOKEN does not have, so today it reports that it cannot read
      # the tip and defers to the post-dispatch check, which only needs the
      # actions access the token does have.
      - name: Verify private automation pin
        id: pin
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AI_DISPATCH_TOKEN }}
        run: |
          set -Eeuo pipefail
          # gh api prints the API error body on stdout, so an emptiness test
          # cannot distinguish "could not read" from "read a value". The exit
          # status is the only reliable signal.
          if ! private_main="$(gh api repos/Franiboy/dnd_dashboard-deploy/commits/main --jq '.sha')"; then
            printf '::warning::AI_DISPATCH_TOKEN cannot read the private main tip; the pin check after the dispatch is authoritative\n'
            printf 'stale=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$private_main" =~ ^[0-9a-f]{40}$ ]]
          if [ "$private_main" != "$PRIVATE_AUTOMATION_REF" ]; then
            printf '::error::DND_PRIVATE_AUTOMATION_REF is %s but the private main tip is %s; update the source variable to the private main tip\n' \
              "$PRIVATE_AUTOMATION_REF" "$private_main"
            exit 1
          fi
          printf 'stale=false\n' >> "$GITHUB_OUTPUT"

      - name: Dispatch private ephemeral AI review
        id: dispatch
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$PRIVATE_AUTOMATION_REF" =~ ^[0-9a-f]{40}$ ]]
          # Recorded before the dispatch so the verification below can identify
          # the run it created. A workflow_dispatch run in the private
          # repository reports the private main commit as its head SHA, never
          # the source pull request head, so the head SHA cannot be used to
          # find it.
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh workflow run ai-review-dispatch.yml \
            --repo Franiboy/dnd_dashboard-deploy \
            --ref main \
            -f source_run_id="$SOURCE_RUN_ID" \
            -f source_run_attempt="$SOURCE_RUN_ATTEMPT" \
            -f dispatch_ref="$PRIVATE_AUTOMATION_REF" \
            -f pr_number="$PR_NUMBER" \
            -f head_sha="$HEAD_SHA" \
            -f base_sha="$BASE_SHA"

      # Confirms the private repository really started a run, and that it
      # started it at the pinned commit. Without this the dispatch looks
      # successful in this repository even when the private validation job
      # rejects the request, which is exactly what a stale
      # DND_PRIVATE_AUTOMATION_REF causes. A workflow_dispatch run reports the
      # private main commit as its head SHA, so comparing that against the pin
      # needs only the actions access AI_DISPATCH_TOKEN has.
      - name: Verify the private review run started
        shell: bash
        env:
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$STARTED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          [[ "$PRIVATE_AUTOMATION_REF" =~ ^[0-9a-f]{40}$ ]]
          for _ in 1 2 3 4 5 6; do
            if found="$(gh run list --repo Franiboy/dnd_dashboard-deploy \
              --workflow ai-review-dispatch.yml --created ">=$STARTED_AT" --limit 1 \
              --json databaseId,headSha \
              --jq 'if length == 0 then "" else "\(.[0].databaseId) \(.[0].headSha)" end')"; then
              if [ -n "$found" ]; then
                run_id="${found%% *}"
                private_head="${found##* }"
                printf 'private review run: %s at %s\n' "$run_id" "$private_head"
                if [ "$private_head" != "$PRIVATE_AUTOMATION_REF" ]; then
                  printf '::error::the private repository dispatched at %s but DND_PRIVATE_AUTOMATION_REF is %s; the private dispatcher rejects that run. Update the source variable to the private main tip:\n\n  gh variable set DND_PRIVATE_AUTOMATION_REF --repo Franiboy/dnd_dashboard --body %s\n\n' \
                    "$private_head" "$PRIVATE_AUTOMATION_REF" "$private_head"
                  exit 1
                fi
                exit 0
              fi
            else
              # A read failure is not a missing run. AI_DISPATCH_TOKEN has to
              # carry actions on the private repository to dispatch it, and
              # without that the dispatch result cannot be observed at all.
              # Reporting that as a failed dispatch would be wrong, so it is
              # raised as a warning and the private dispatcher stays the
              # authoritative gate.
              printf '::warning::cannot read runs of Franiboy/dnd_dashboard-deploy; the dispatch for pull request %s was sent but its start and pin are unverified\n' \
                "$PR_NUMBER"
              exit 0
            fi
            sleep 10
          done
          printf '::error::no private AI review run was created after %s; check DND_PRIVATE_AI_ENABLED and DND_PRIVATE_AUTOMATION_REF in the private repository (source head %s)\n' \
            "$STARTED_AT" "$HEAD_SHA"
          exit 1
