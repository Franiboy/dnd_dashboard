name: CI/CD

on:
  push:
  pull_request:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          # Self-hosted runner: keep node_modules across runs (checkout clean:false).
          # npm ci always reinstalls from scratch, so skip it when the lockfile +
          # Node version are unchanged. Marker lives in the persistent home dir
          # (runner _temp is cleared after every job).
          hash="$(sha256sum package-lock.json | cut -d' ' -f1)-$(node -v)"
          marker="$HOME/.cache/dnd-ci/npm-$hash"
          mkdir -p "$HOME/.cache/dnd-ci"
          if [ -f "$marker" ] && [ -d node_modules ]; then
            echo "node_modules unchanged, skipping npm ci"
          else
            npm ci
            : > "$marker"
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Run deploy script
        run: bash scripts/dnd-deploy.sh
        shell: bash
        env:
          DND_DEPLOY_REPO: /dnd_dashboard
